<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Critical Security Alert</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Courier New", Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* واجهة البداية */
        #startScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 122, 255, 0.2);
            text-align: center;
            max-width: 320px;
            width: 85%;
        }

        #startScreen h2 {
            color: #ffffff;
            font-size: 17px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        #startScreen p {
            color: #8e8e93;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .start-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .start-btn:active {
            background-color: #0056b3;
        }

        /* شاشة التحذير (مخفية بالبداية) */
        #mainAlert {
            display: none;
            width: 85%;
            max-width: 320px;
            background-color: rgba(30, 30, 30, 0.95);
            border-radius: 14px;
            text-align: center;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(255, 0, 51, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .alert-content {
            padding: 20px 16px 15px 16px;
        }

        .alert-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        h1 {
            color: #ff3b30;
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #ffffff;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .terminal-box {
            background: #0a0a0a;
            border: 1px solid #ff3b30;
            border-radius: 8px;
            padding: 10px;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #00ff66;
            height: 90px;
            overflow: hidden;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .alert-buttons {
            display: flex;
            border-top: 0.5px solid rgba(255, 255, 255, 0.15);
        }

        .alert-btn {
            flex: 1;
            background: none;
            border: none;
            color: #0a84ff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 0;
            cursor: pointer;
            font-family: inherit;
        }

        .alert-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- واجهة البداية -->
    <div id="startScreen">
        <h2>فحص الأمان السريع</h2>
        <p>اضغط أدناه لبدء فحص ملفات وسجل النظام للتأكد من سلامة الأمان.</p>
        <button class="start-btn" id="startBtn">بدء الفحص</button>
    </div>

    <!-- شاشة التحذير -->
    <div id="mainAlert">
        <div class="alert-content">
            <div class="alert-icon">⚠️</div>
            <h1>تحذير أمني لنظام iOS</h1>
            <div class="subtitle">تم رصد عملية وصول غير مصرح بها. جاري سحب وتشفير بيانات الجهاز بالكامل.</div>
            
            <div class="terminal-box" id="logBox">
                [+] الاتصال بجذر النظام...
            </div>
        </div>

        <div class="alert-buttons">
            <button class="alert-btn" onclick="alert('لا يمكن التراجع، النظام تحت السيطرة الكاملة!')">إلغاء القفل</button>
        </div>
    </div>

    <script>
        // ربط الزر بالحدث برمجياً لضمان الاستجابة الكاملة على الجوال
        document.getElementById('startBtn').addEventListener('click', function() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('mainAlert').style.display = 'block';
            runLogs();
        });

        const logs = [
            "[+] تجاوز جدار الحماية بنجاح.",
            "[-] جاري سحب كلمات المرور...",
            "[+] تم الاستيلاء على الجلسات (Sessions).",
            "[-] جارِ رفع الملفات والصور للخادم...",
            "[!] تحذير: فقدان كامل للسيطرة."
        ];

        let logBox = document.getElementById('logBox');
        let i = 0;

        function runLogs() {
            if (i < logs.length) {
                logBox.innerHTML += "<br>" + logs[i];
                logBox.scrollTop = logBox.scrollHeight;
                i++;
                setTimeout(runLogs, 900);
            }
        }
    </script>

</body>
</html>

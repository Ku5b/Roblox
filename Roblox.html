<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير أمني خطير</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            border: 2px solid #ff0033;
            padding: 40px;
            border-radius: 10px;
            background-color: rgba(20, 0, 0, 0.8);
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.5);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #ff0033;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0033;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #ffcccc;
            margin-bottom: 30px;
        }

        .warning-icon {
            font-size: 60px;
            color: #ff0033;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        .ip-box {
            background: #111;
            border: 1px dashed #00ff66;
            padding: 10px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #00ff66;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="warning-icon">⚠️</div>
        <h1>تم اختراق الجهاز!</h1>
        <p>تحذير أمني: تم رصد نشاط مشبوه، ونتيجة لذلك تم سحب جميع معلوماتك الشخصية، كلمات المرور، والملفات بنجاح إلى الخادم الخارجي.</p>
        
        <div class="ip-box" id="infoBox">
            جاري فحص العنوان الرقمي...
        </div>
    </div>

    <script>
        // إصدار صوت تنبيه خفيف أو تأثير وهمي لجلب عنوان IP (اختياري للواقعية)
        setTimeout(() => {
            document.getElementById('infoBox').innerText = "الحالة: تم إرسال البيانات بالكامل | النظام تحت السيطرة";
        }, 1500);
    </script>

</body>
</html>
